name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL --retry 3 --retry-all-errors https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o zig.tar.xz
          tar -xJf zig.tar.xz
          echo "$(pwd)/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
      - run: zig build --release=fast